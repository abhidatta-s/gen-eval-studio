<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="system-ui, -apple-system, Inter, Segoe UI, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#151722"/>
  <text x="600" y="50" text-anchor="middle" font-size="28" font-weight="700" fill="#e6e8f0">gen-eval-studio: five nodes, left to right</text>
  <text x="600" y="80" text-anchor="middle" font-size="16" fill="#a9afc4">Each node is one small function in its own module</text>

  <!-- main nodes -->
  <rect x="30" y="250" width="190" height="90" rx="14" fill="#1e2130" stroke="#3a3f55" stroke-width="2"/>
  <text x="125" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8f0">load_prompts</text>
  <text x="125" y="314" text-anchor="middle" font-size="14" fill="#a9afc4">prompts JSON</text>

  <rect x="270" y="250" width="190" height="90" rx="14" fill="#1e2130" stroke="#3a3f55" stroke-width="2"/>
  <text x="365" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8f0">render_template</text>
  <text x="365" y="314" text-anchor="middle" font-size="14" fill="#a9afc4">fill {placeholders}</text>

  <rect x="510" y="250" width="190" height="90" rx="14" fill="#262a3b" stroke="#6366f1" stroke-width="3"/>
  <text x="605" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8f0">generate</text>
  <text x="605" y="314" text-anchor="middle" font-size="14" fill="#a9afc4">pick a generator</text>

  <rect x="750" y="250" width="190" height="90" rx="14" fill="#1e2130" stroke="#3a3f55" stroke-width="2"/>
  <text x="845" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8f0">score</text>
  <text x="845" y="314" text-anchor="middle" font-size="14" fill="#a9afc4">rule checks</text>

  <rect x="990" y="250" width="180" height="90" rx="14" fill="#1e2130" stroke="#3a3f55" stroke-width="2"/>
  <text x="1080" y="288" text-anchor="middle" font-size="19" font-weight="700" fill="#e6e8f0">report</text>
  <text x="1080" y="314" text-anchor="middle" font-size="14" fill="#a9afc4">pass rates</text>

  <!-- arrows between nodes -->
  <line x1="220" y1="295" x2="266" y2="295" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="460" y1="295" x2="506" y2="295" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="295" x2="746" y2="295" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="940" y1="295" x2="986" y2="295" stroke="#a5b4fc" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- generator fan-out (below) -->
  <rect x="330" y="480" width="170" height="64" rx="12" fill="#262a3b" stroke="#3a3f55" stroke-width="2"/>
  <text x="415" y="518" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8f0">Mock (default)</text>
  <rect x="520" y="480" width="170" height="64" rx="12" fill="#262a3b" stroke="#3a3f55" stroke-width="2"/>
  <text x="605" y="518" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8f0">Hugging Face</text>
  <rect x="710" y="480" width="170" height="64" rx="12" fill="#262a3b" stroke="#3a3f55" stroke-width="2"/>
  <text x="795" y="518" text-anchor="middle" font-size="17" font-weight="700" fill="#e6e8f0">Ollama</text>

  <line x1="570" y1="342" x2="440" y2="476" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="605" y1="342" x2="605" y2="476" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="640" y1="342" x2="770" y2="476" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="605" y="580" text-anchor="middle" font-size="14" fill="#a9afc4">Compare several in one run: --generators mock,hf</text>

  <!-- output files (above) -->
  <rect x="930" y="110" width="110" height="52" rx="12" fill="#262a3b" stroke="#3a3f55" stroke-width="2"/>
  <text x="985" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#4ade80">JSON</text>
  <rect x="1050" y="110" width="110" height="52" rx="12" fill="#262a3b" stroke="#3a3f55" stroke-width="2"/>
  <text x="1105" y="143" text-anchor="middle" font-size="16" font-weight="700" fill="#4ade80">CSV</text>
  <rect x="990" y="180" width="110" height="52" rx="12" fill="#262a3b" stroke="#3a3f55" stroke-width="2"/>
  <text x="1045" y="213" text-anchor="middle" font-size="16" font-weight="700" fill="#4ade80">HTML</text>
  <line x1="1050" y1="246" x2="1050" y2="238" stroke="#a5b4fc" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="840" y="150" text-anchor="middle" font-size="14" fill="#a9afc4">report writes three files</text>
</svg>
